services:
  - type: web
    name: renea-erp
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: CLEANUP_TASK_SECRET
        generateValue: true
      - key: VITE_CLOUD_PROVIDER
        value: supabase
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_ORGANIZATION_ID
        value: renea
      # Link de compartilhamento da planilha de compras (OneDrive/SharePoint).
      # Sem ele a sincronização de 3 em 3 horas não liga.
      - key: PROCUREMENT_SPREADSHEET_URL
        sync: false
      # Site → planilha: endereço do App da Web do script da planilha
      # (scripts/google-planilha-compras.gs) e a senha combinada com ele.
      - key: PROCUREMENT_SHEET_WRITE_URL
        sync: false
      - key: PROCUREMENT_SHEET_WRITE_TOKEN
        sync: false
